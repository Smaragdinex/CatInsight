<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CatInsight Stock — Room</title>
<!-- 分頁標題:5 格 —— 📈 在最左、📉 在最右,貓在中間 3 格左右來回走 -->
<script>
  (() => { const B = '\u2003'; let pos = 1, dir = 1;
    const draw = () => { const mid = [B, B, B]; mid[pos] = '🐱'; document.title = 'CatInsight 📈' + mid.join('') + '📉'; pos += dir; if (pos === 2 || pos === 0) dir = -dir; };
    draw(); setInterval(draw, 500); })();
</script>
<meta name="description" content="CatInsight Stock — step into the room. AI stock research for US and Taiwan markets." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="manifest" href="/catinsight-3d/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CatInsight">
<meta name="theme-color" content="#c9e8b8">
<link rel="apple-touch-icon" href="/catinsight-3d/icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Noto Sans TC", sans-serif;
    background: radial-gradient(120% 90% at 50% 40%, #3a2a66 0%, #2a1f4e 45%, #1d1538 100%);
    color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .brand { position: fixed; top: 22px; left: 26px; display: flex; align-items: center; gap: 10px; z-index: 5; text-decoration: none; color: #fff; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .brand b { font-weight: 700; letter-spacing: .2px; }
  .brand span { opacity: .65; font-weight: 500; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; background: #2a1f4e;
    transition: opacity .6s; font-size: 14px; letter-spacing: .3px; opacity: .9;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .cta { position: fixed; right: 28px; bottom: 34px; z-index: 5; display: flex; gap: 10px; }
  .cta a { text-decoration: none; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; }
  .cta .primary { background: #ff6f91; color: #fff; }
  .cta .ghost { background: rgba(255,255,255,.12); color: #fff; }
  /* 底部控制列:‹ 往回、› 往前(等於滾輪),中間是「進螢幕 / 回房間」 */
  .pill {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px;
    background: #fff; color: #2a1f4e; box-shadow: 0 12px 40px rgba(0,0,0,.35); z-index: 8;
    transition: bottom .3s ease;
  }
  .pill button {
    width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: #2a1f4e;
    font-size: 24px; cursor: pointer; display: grid; place-items: center; transition: background .15s;
  }
  .pill button:hover { background: #f1ecfb; }
  .pill button.mid { color: #7b5cf5; }
  .pill button.mid svg { width: 22px; height: 22px; }
  .pill button.mid .home { display: none; }
  body.ui-on .pill button.mid .mouse { display: none; }
  body.ui-on .pill button.mid .home { display: block; }
  /* 街機遊戲:點街機後淡入,中間是嵌入貓咪瑪利歐小遊戲的 iframe(960×544,依視窗縮放) */
  #game-ui { position: fixed; inset: 0; z-index: 6; background: #c9e8b8; opacity: 0; pointer-events: none; transition: opacity .55s ease; display: grid; place-items: center; }
  #game-ui.on { opacity: 1; pointer-events: auto; }
  /* 遊戲畫面蓋滿整個視窗,沒有外框(鏡頭已經推進到只剩螢幕) */
  #game-ui .cab { position: absolute; inset: 0; background: #c9e8b8; }
  #game-ui .scr, #game-ui iframe { width: 100%; height: 100%; border: 0; display: block; background: #c9e8b8; }
  /* 手機直拿時把遊戲轉成橫向(iframe 整個轉 90°,裡面的遊戲看到的就是橫的視窗,觸控座標瀏覽器會自己換算) */
  #game-ui.rot .scr { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg); transform-origin: center; }
  #game-ui.rot #game-exit { right: auto; left: 14px; top: 12px; transform: rotate(90deg); }
  #pwa-hint { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 0 14px calc(18px + env(safe-area-inset-bottom)); background: rgba(40,30,25,.45); }
  #pwa-hint.hide { display: none; }
  #pwa-hint .box { width: min(440px, 100%); background: #fff8ec; border: 3px solid #fff; border-radius: 22px; padding: 16px 18px; box-shadow: 0 14px 40px rgba(0,0,0,.3); color: #3b2f2a; font-family: "Avenir Next", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  #pwa-hint b { display: block; font-size: 17px; font-weight: 900; margin-bottom: 6px; }
  #pwa-hint p { margin: 0 0 12px; font-size: 14px; line-height: 1.55; font-weight: 700; color: #6b594e; white-space: pre-line; }
  #pwa-hint .row { display: flex; gap: 10px; }
  #pwa-hint button { flex: 1; border: 0; border-radius: 999px; padding: 11px 0; font: inherit; font-weight: 900; font-size: 15px; background: #eadfce; color: #6b594e; }
  #pwa-hint button.go { background: #ff7a59; color: #fff; box-shadow: 0 3px 0 #d4553a; }
  #pwa-hint button.hide { display: none; }
  /* 離開鈕:插畫圖(紅圓 + 白叉) */
  #game-exit { position: absolute; right: 10px; top: 12px; z-index: 2; width: 48px; height: 48px; border: 0; border-radius: 50%; padding: 0;
    background: url(btn-close.webp?v=1) center/contain no-repeat; color: transparent; font-size: 0; cursor: pointer; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); transition: transform .12s; }
  #game-exit:hover { transform: scale(1.06); }
  #game-exit:active { transform: scale(.94); }
  body.game-on .pill { opacity: 0; pointer-events: none; }
  body.game-on .cta { opacity: 0; pointer-events: none; }
  .brand, .cta { transition: opacity .35s; }
  body.arcade-on .cta, body.arcade-on .brand { opacity: 0; pointer-events: none; }
  body.game-on .pill button.mid .mouse { display: none; }
  body.game-on .pill button.mid .home { display: block; }
  /* 螢幕介面:鏡頭定在螢幕後淡入,一頁一頁介紹功能 */
  #screen-ui {
    position: fixed; inset: 0; z-index: 6; background: #0b0e17; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .55s ease; overflow: hidden; touch-action: none;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  #screen-ui.on { opacity: 1; pointer-events: auto; }
  #screen-ui .track { position: absolute; inset: 0; transition: transform .75s cubic-bezier(.65,0,.25,1); will-change: transform; }
  #screen-ui .slide { position: absolute; left: 0; right: 0; height: 100%; display: grid; place-items: center; padding: 0 24px; }
  /* 兩欄:左文字、右 widget */
  #screen-ui .s { width: min(1120px, 100%); display: grid; grid-template-columns: 44% 56%; gap: 40px; align-items: center; padding: 0 56px 0 40px; }
  #screen-ui .txt, #screen-ui .wg, #screen-ui .hero > * { opacity: 0; transform: translateY(26px); transition: opacity .6s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.2,.8,.2,1); }
  #screen-ui .slide.on .txt { opacity: 1; transform: none; transition-delay: .15s; }
  #screen-ui .slide.on .wg  { opacity: 1; transform: none; transition-delay: .32s; }
  #screen-ui .slide.on .hero > * { opacity: 1; transform: none; }
  #screen-ui .slide.on .hero > :nth-child(3) { transition-delay: .1s; } #screen-ui .slide.on .hero > :nth-child(4) { transition-delay: .22s; }
  #screen-ui .slide.on .hero > :nth-child(5) { transition-delay: .34s; } #screen-ui .slide.on .hero > :nth-child(6) { transition-delay: .44s; }
  #screen-ui .eyebrow { font-size: 12px; letter-spacing: 3px; font-weight: 700; color: var(--c); margin-bottom: 14px; }
  #screen-ui h2 { font-size: clamp(30px, 4.2vw, 50px); font-weight: 800; letter-spacing: -.5px; line-height: 1.08; margin-bottom: 16px; }
  #screen-ui p { font-size: clamp(15px, 1.5vw, 19px); line-height: 1.55; opacity: .82; }
  #screen-ui .zh { margin-top: 12px; font-size: 14px; opacity: .55; }
  #screen-ui .muted { opacity: .5; font-size: 12px; }
  #screen-ui .green { color: #4be07a; }
  #screen-ui .up { color: #4be07a; } #screen-ui .dn { color: #ff5c6a; }
  #screen-ui .wg { position: relative; min-height: 380px; display: grid; place-items: center; }
  #screen-ui .glow { position: absolute; inset: -10% -6%; background: radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); pointer-events: none; }
  #screen-ui .wgin { position: relative; width: 100%; display: grid; place-items: center; }
  /* 開場 */
  #screen-ui .hero { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #screen-ui .hero .bgc { position: absolute; left: 0; right: 0; top: 0; bottom: 0; width: 100%; height: 100%; opacity: .32; pointer-events: none; }
  #screen-ui .hero .chips { position: absolute; inset: 0; pointer-events: none; }
  #screen-ui .chip { position: absolute; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font-size: 12px; backdrop-filter: blur(6px); animation: floaty 8s ease-in-out infinite; }
  #screen-ui .chip b { font-weight: 700; } #screen-ui .chip.up b { color: #4be07a; } #screen-ui .chip.dn b { color: #ff5c6a; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }
  #screen-ui .icon { width: 108px; height: 108px; margin: 0 auto 28px; border-radius: 30px; display: grid; place-items: center; font-size: 56px;
    background: linear-gradient(145deg, #2a2352, #151a33); box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }
  #screen-ui .icon.img { background: none; overflow: hidden; }
  #screen-ui .icon.img img { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; display: block; }
  #screen-ui .store { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 14px 26px; border-radius: 999px; background: #fff; color: #0b0e17; font-weight: 700; text-decoration: none; font-size: 17px; }
  /* 卡片 */
  #screen-ui .card { width: min(460px, 100%); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: 22px; padding: 18px 20px; box-shadow: 0 30px 80px rgba(0,0,0,.45); backdrop-filter: blur(10px); }
  #screen-ui .ch { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  #screen-ui .ch small { display: block; font-weight: 500; font-size: 12px; opacity: .55; }
  #screen-ui .row { display: grid; grid-template-columns: 22px 1fr 110px 36px 52px; align-items: center; gap: 10px; height: 48px; font-size: 14px; }
  #screen-ui .row .rk { opacity: .5; font-variant-numeric: tabular-nums; }
  #screen-ui .row .tk { font-weight: 700; } #screen-ui .row .tk small { display: block; font-weight: 500; font-size: 11px; opacity: .5; }
  #screen-ui .row .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  #screen-ui .row .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--c); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  #screen-ui .row .sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  #screen-ui .row .bd { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-align: center; padding: 4px 0; border-radius: 6px; }
  #screen-ui .bd.buy { background: rgba(75,224,122,.18); color: #4be07a; } #screen-ui .bd.hold { background: rgba(245,196,81,.18); color: #f5c451; } #screen-ui .bd.sell { background: rgba(255,92,106,.18); color: #ff5c6a; }
  #screen-ui .picks .list { position: relative; height: 290px; }
  #screen-ui .picks .row { position: absolute; left: 0; right: 0; top: 0; transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  #screen-ui .foot { margin-top: 8px; text-align: right; }
  #screen-ui .chart canvas { width: 100%; height: 220px; display: block; cursor: crosshair; }
  #screen-ui .chart .px { text-align: right; } #screen-ui .chart .px b { font-size: 22px; display: block; } #screen-ui .chart .px small { font-size: 12px; font-weight: 600; }
  #screen-ui .tabs { display: flex; gap: 4px; margin-top: 10px; }
  #screen-ui .tabs span { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; font-size: 12px; font-weight: 700; opacity: .55; cursor: pointer; transition: all .2s; }
  #screen-ui .tabs span.on { opacity: 1; background: rgba(255,255,255,.12); }
  #screen-ui .gainers .ch .tabs { margin: 0; gap: 2px; } #screen-ui .gainers .ch .tabs span { padding: 5px 10px; flex: none; }
  #screen-ui .gainers .row { grid-template-columns: 22px 1fr 120px 74px; animation: rowin .5s both cubic-bezier(.2,.8,.2,1); }
  #screen-ui .gainers .row .bar i { transition: none; } #screen-ui .gainers .pc { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  @keyframes rowin { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  #screen-ui .news .head { font-size: 19px; font-weight: 800; line-height: 1.3; margin-bottom: 14px; }
  #screen-ui .news .ai { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--c); margin-bottom: 6px; }
  #screen-ui .news .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #screen-ui .news .sum { font-size: 15px; line-height: 1.6; min-height: 100px; opacity: .9; }
  #screen-ui .news .call { display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 1px; opacity: 0; transform: scale(.8); transition: all .35s cubic-bezier(.2,.8,.2,1); }
  #screen-ui .news .call.on { opacity: 1; transform: none; }
  #screen-ui .call.bullish { background: rgba(75,224,122,.18); color: #4be07a; } #screen-ui .call.bearish { background: rgba(255,92,106,.18); color: #ff5c6a; } #screen-ui .call.neutral { background: rgba(245,196,81,.18); color: #f5c451; }
  #screen-ui .voice { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; }
  #screen-ui .voice .orb { grid-column: 1; grid-row: 1; width: 250px; height: 250px; }
  #screen-ui .voice .state { grid-column: 1; grid-row: 2; text-align: center; margin-top: -8px; }
  #screen-ui .bubbles { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  @media (max-width: 1100px) { #screen-ui .voice { grid-template-columns: 1fr; justify-items: center; } #screen-ui .voice .orb, #screen-ui .voice .state, #screen-ui .bubbles { grid-column: 1; grid-row: auto; } #screen-ui .bubbles { width: 100%; } }
  #screen-ui .bub { max-width: 100%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; animation: rowin .4s both; }
  #screen-ui .bub.you { align-self: flex-end; background: #5b5be6; border-bottom-right-radius: 4px; }
  #screen-ui .bub.ai { align-self: flex-start; background: rgba(255,255,255,.08); border-bottom-left-radius: 4px; }
  #screen-ui .phone { width: 340px; height: 380px; border-radius: 36px; background: linear-gradient(160deg, #1c2340, #0f1426); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 30px 80px rgba(0,0,0,.5); padding: 14px 12px; overflow: hidden; }
  #screen-ui .phone .status { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; padding: 4px 14px 12px; opacity: .8; }
  #screen-ui .notif { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; padding: 12px 12px; border-radius: 18px; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); margin-bottom: 8px; opacity: 0; transform: translateY(-24px) scale(.96); transition: all .45s cubic-bezier(.2,.9,.2,1.1); font-size: 13px; }
  #screen-ui .notif.in { opacity: 1; transform: none; } #screen-ui .notif.out { opacity: 0; transform: translateY(10px); }
  #screen-ui .notif .ic { width: 34px; height: 34px; border-radius: 9px; background: #2a2352; display: grid; place-items: center; font-size: 18px; }
  #screen-ui .notif b { font-size: 11px; opacity: .6; } #screen-ui .notif .t { font-weight: 700; } #screen-ui .notif .m { opacity: .8; font-size: 12px; margin-top: 2px; }
  #screen-ui .notif .time { font-size: 11px; opacity: .5; }
  #screen-ui .ttl { display: flex; align-items: center; gap: 26px; flex-wrap: nowrap; margin-bottom: 16px; }
  #screen-ui .slide-app .s { grid-template-columns: 54% 46%; }
  #screen-ui .slide-app h2 { font-size: clamp(30px, 3.4vw, 44px); white-space: nowrap; }
  #screen-ui .ttl h2 { margin-bottom: 0; }
  #screen-ui .h2icon { width: 232px; height: 232px; border-radius: 58px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  #screen-ui .dl .qr { text-align: center; padding: 22px 22px 16px; border-radius: 26px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  #screen-ui .dl .qr canvas { display: block; margin: 0 auto 10px; }
  #screen-ui .dl .qr .muted { font-size: 13px; }
  @media (max-width: 820px) {
    #screen-ui .s { grid-template-columns: 1fr; gap: 18px; padding: 0 8px; }
    #screen-ui .txt { text-align: center; } #screen-ui .wg { min-height: 0; }
    #screen-ui h2 { font-size: 28px; } #screen-ui p { font-size: 14px; } #screen-ui .zh { display: none; }
    #screen-ui .card { padding: 14px; } #screen-ui .picks .list { height: 240px; } #screen-ui .picks .row { height: 44px; }
    #screen-ui .chart canvas { height: 150px; }
    #screen-ui .phone { width: 300px; height: 300px; } #screen-ui .ttl { justify-content: center; gap: 14px; } #screen-ui .h2icon { width: 120px; height: 120px; border-radius: 30px; }
    #screen-ui .dots { display: none; }
    #screen-ui .picks .foot { display: none; }
  }
  #screen-ui .num { position: absolute; top: 24px; right: 28px; font-size: 13px; letter-spacing: 2px; opacity: .55; font-variant-numeric: tabular-nums; }
  #screen-ui .dots { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
  #screen-ui .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.22); cursor: pointer; transition: all .25s; }
  #screen-ui .dots i.on { background: #fff; height: 22px; border-radius: 4px; }
  body.ui-on .cta { opacity: 0; pointer-events: none; }
  .cta { transition: opacity .4s; }
  @media (max-width: 640px) { .hint, .cta { display: none; } }
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<a class="brand" id="brand" href="/catinsight-3d/" aria-label="CatInsight Stock 3D room"><img src="/assets/icon-180.png" alt=""><b>CatInsight</b><span>Stock</span></a>
<div class="cta">
  <a class="primary" href="https://apps.apple.com/app/id6763914049">Get the App</a>
</div>
<div id="screen-ui">
  <div class="track"></div>
  <div class="num"></div>
  <div class="dots"></div>
</div>
<div id="game-ui">
  <div class="cab">
    <button id="game-exit" aria-label="Exit game" title="Exit (Esc)">✕</button>
    <div class="scr"></div>
  </div>
</div>
<!-- 手機沒有從主畫面開啟時的提示:加入主畫面就能全螢幕(iOS 只能由使用者自己加;Android 可以直接跳安裝) -->
<div id="pwa-hint" class="hide">
  <div class="box">
    <b id="pwa-title"></b>
    <p id="pwa-text"></p>
    <div class="row"><button id="pwa-install" class="go hide"></button><button id="pwa-ok"></button></div>
  </div>
</div>
<div class="pill">
  <button id="prev" aria-label="back">‹</button>
