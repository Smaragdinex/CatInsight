<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cat Street Stocks</title>
<!-- 分頁標題的小動畫:貓繞著棋盤走(格子往右捲,貓固定在中間)。標題文字由 board.mjs 依語言放在 data-title -->
<script>
  (() => { const BLANK = '\u2003', W = 9, C = 4;
    const tiles = Array.from({ length: W }, (_, i) => (i % 2 === 1 ? ['🏦', '🎁', '🏪', '⭐', '🏠'][(i / 2 | 0) % 5] : BLANK));
    const draw = () => { document.title = `${document.documentElement.dataset.title || 'Cat Street Stocks'} ${tiles.map((c, i) => (i === C ? '🐈' : c)).join('')}`; };
    draw(); setInterval(() => { tiles.unshift(tiles.pop()); draw(); }, 240); })();
</script>
<link rel="preload" as="image" href="card-event.webp"><link rel="preload" as="image" href="card-fate.webp"><link rel="preload" as="image" href="card-gift.webp">
<link rel="manifest" href="/catinsight-3d/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CatInsight">
<meta name="theme-color" content="#9bdc7a">
<link rel="apple-touch-icon" href="/catinsight-3d/icon-192.png">
<link rel="stylesheet" href="style.css?v=77">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud">
  <div class="ava" id="avaMe" style="background-image:url(/assets/app-icon.png)"><i class="crown hide" id="crown"><img src="crown.webp?v=1" alt=""></i><div class="ranktag" id="rankTxt"></div></div>
  <div class="mecol"><div class="cashpill"><span class="coin"></span><span id="cash">10,000</span></div><div class="merow"><button class="stockbtn" id="stockBtn" aria-label="my assets"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="5" height="10" rx="1.5"/><rect x="9.5" y="5" width="5" height="16" rx="1.5"/><rect x="16" y="9" width="5" height="12" rx="1.5"/></svg></button></div></div>
  <div class="bar hide">
    <div class="pill"><span class="coin"></span><span id="cash2">10,000</span></div>
    <div class="stat"><span id="lblAssets"></span><b id="assets">10,000</b></div>
    <div class="stat opt"><span id="lblStocks"></span><b id="stocks">0</b></div>
    <div class="sp"></div>
  </div>
</div>
<!-- 右上角:音樂、全螢幕(金錢列拿掉了,數字都在資產框裡) -->
<div class="topbtns"><button class="snd" id="sndBtn">♪</button><button class="snd fs hide" id="fsBtn" aria-label="fullscreen"></button></div>
<div class="tipbar" id="tipbar"><div class="bubble"><span class="av ex">!</span><span id="tip"></span></div></div>
<div class="rbanner hide" id="remoteBanner"></div>
<!-- 左:玩家頭像直排(點誰看誰的資產)+ 資產框。右:任務(可收合,展開看全部)+ 市場事件 -->
<div class="lcol">
  <div class="tabs col" id="assetTabs"></div>
  <div class="box assets" id="assetBox"><h4><span id="assetTitle"></span><span class="tri"></span></h4><div id="assetRows"></div></div>
</div>
<!-- 右邊:兩顆圖示按鈕(市場事件 / 任務),點了在旁邊彈出對應的框 -->
<div class="rcol">
  <div class="rbtns">
    <!-- 事件 / 任務:和擲骰、背包同一套扁平風 —— 彩色圓 + 白邊 + 白色線條圖,右上角紅點,下面小標籤 -->
    <button class="rb evt" id="evtBtn" aria-label="events"><i class="ic"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="27" y="12" width="26" height="36" rx="5" fill="#fff" opacity=".55" transform="rotate(12 40 30)"/><rect x="14" y="14" width="28" height="38" rx="5" fill="#fff" transform="rotate(-8 28 33)"/><g transform="rotate(-8 28 33)"><circle cx="28" cy="31" r="8.5" fill="#f5b942"/><text x="28" y="35.5" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" font-family="Arial, sans-serif">?</text><rect x="20" y="43" width="16" height="3.2" rx="1.6" fill="#f5b942" opacity=".8"/></g></svg></i><i class="bd hide" id="evtBadge">!</i><span id="evtLbl"></span></button>
    <button class="rb tsk" id="missBtn" aria-label="achievements"><i class="ic"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="14" y="10" width="36" height="44" rx="6" fill="#fff"/><rect x="24" y="6" width="16" height="8" rx="3" fill="#ffd1e4"/><g fill="#ff8fc0"><rect x="20" y="22" width="7" height="7" rx="2"/><rect x="20" y="33" width="7" height="7" rx="2"/><rect x="20" y="44" width="7" height="7" rx="2" fill="none" stroke="#ff8fc0" stroke-width="2"/></g><g fill="#ffb6d3"><rect x="31" y="23.5" width="14" height="4" rx="2"/><rect x="31" y="34.5" width="12" height="4" rx="2"/><rect x="31" y="45.5" width="13" height="4" rx="2"/></g><path d="M21.5 25.5l2 2 3-3.5M21.5 36.5l2 2 3-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i><i class="bd" id="missBadge">3</i><span id="missLbl"></span></button>
  </div>
  <div class="rpop">
    <div class="box ev evt fold" id="evtBox"><h4><span id="evtTitle"></span><span class="tri"></span></h4><div class="body" id="evtBody"></div></div>
    <div class="box missbox fold" id="missBox"><h4><span id="missTitle"></span><span class="tri"></span></h4><div class="miss" id="miss"></div></div>
  </div>
</div>

<div class="ctl" id="ctl">
  <!-- 背包:和擲骰鈕同一套扁平風,但用藍色(和橘色擲骰鈕區隔),右上角紅點是道具數量 -->
  <button class="paw bag" id="bagBtn" aria-label="backpack"><svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M24 14c0-5 3.6-8 8-8s8 3 8 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <rect x="12" y="16" width="40" height="40" rx="12" fill="#fff"/>
      <path d="M12 30c0-7 6-12 20-12s20 5 20 12v2H12z" fill="#d8edff"/>
      <rect x="20" y="36" width="24" height="14" rx="5" fill="#3f9df0"/>
      <rect x="24" y="30" width="5" height="12" rx="2" fill="#a9d6ff"/><rect x="35" y="30" width="5" height="12" rx="2" fill="#a9d6ff"/>
      <circle cx="26.5" cy="45" r="1.8" fill="#fff"/><circle cx="37.5" cy="45" r="1.8" fill="#fff"/>
      <circle cx="32" cy="26" r="3.2" fill="#3f9df0"/>
    </svg><b id="bagCount">1</b></button>
  <div class="rollcol">
    <div class="dsel" id="dsel"><button data-n="1" id="d1"></button><button data-n="2" id="d2" class="on"></button></div>
    <!-- 擲骰鈕:沒有字,只有往上拋的骰子;選一顆就一顆、兩顆就兩顆。休息中才顯示文字 -->
    <button class="roll" id="rollBtn" aria-label="roll"><span class="dice two" id="rollDice" aria-hidden="true"><span class="die"><svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="11" fill="#fff"/><g fill="#ff7a59"><circle cx="15" cy="15" r="4.2"/><circle cx="33" cy="15" r="4.2"/><circle cx="24" cy="24" r="4.2"/><circle cx="15" cy="33" r="4.2"/><circle cx="33" cy="33" r="4.2"/></g></svg></span><span class="die"><svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="11" fill="#fff"/><g fill="#ff7a59"><circle cx="15" cy="15" r="4.2"/><circle cx="33" cy="33" r="4.2"/><circle cx="15" cy="33" r="4.2"/><circle cx="33" cy="15" r="4.2"/></g></svg></span></span><span id="rollTxt"></span></button>
    <span class="roundTxt" id="roundTxt"></span>
  </div>
</div>
<div class="ctl hide" id="stepCtl">
  <div class="steps" id="steps"></div>
</div>
<div class="panel hide" id="panel"></div>
<div class="toast" id="toast"></div>
<div class="achv" id="achv"></div>   <!-- 成就達成的跳出卡 -->
<div class="pickui">
  <div class="ptop">
    <!-- 設定卡:每一列 = 圖示 + 標題 / 副標 + 右邊的選項 -->
    <div class="pcfg" id="pcfg">
      <div class="pawtag"></div>
      <div class="prow"><span class="ico"><img src="ic-players.webp?v=1" alt=""></span><span class="lbl"><b id="pcN"></b></span><span class="step" id="pcNst"><button data-ns="-1" aria-label="fewer players">−</button><b id="pcNv">2</b><button data-ns="1" aria-label="more players">+</button></span></div>
      <button class="online" id="pcOnline"><span class="oic"><img src="ic-online.webp?v=1" alt=""></span><span class="otx"><b id="pcOnT"></b><small id="pcOnS"></small></span><span class="chev">›</span></button>
      <div class="lobby hide" id="lobby"></div>
      <div class="prow" id="pcDrow"><span class="ico"><img src="ic-computer.webp?v=1" alt=""></span><span class="lbl"><b id="pcD"></b></span><span class="step" id="pcDst"><button data-ds="-1" aria-label="easier">−</button><b id="pcDv"></b><button data-ds="1" aria-label="harder">+</button></span></div>
      <div class="prow"><span class="ico"><img src="ic-rounds.webp?v=1" alt=""></span><span class="lbl"><b id="pcM"></b></span><span class="step" id="pcR"><button data-r="-1" aria-label="fewer rounds">−</button><b id="pcRv">20</b><button data-r="1" aria-label="more rounds">+</button></span></div>
    </div>
  </div>
  <!-- 第二步(多人連線):人數格大廳 — QR / 房號在上,中間 2~4 個位子,下面 返回 / 開始 -->
  <div class="lobbyui hide" id="lobbyUI">
    <div class="lobbycard" id="lobbyCard"></div>
    <div class="lobbybar"><button class="pback" id="lobbyBack">‹</button><button class="pok" id="lobbyGo"></button></div>
  </div>
  <div class="pbar">
    <!-- 角色名和「你的名字」同一格:左邊角色名,右邊打名字 -->
    <div class="pnav"><button id="pprev" aria-label="previous">‹</button><span class="pname2"><b id="pname"></b><input class="pnameIn" id="pnameIn" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false"></span><button id="pnext" aria-label="next">›</button></div>
    <button class="pok" id="pok"></button>
  </div>
</div>
<div class="draw hide" id="draw"></div>
<div class="end hide" id="end"></div>
<div class="note" id="note"></div>

<script type="module" src="./board.mjs?v=288"></script>
</body>
</html>
